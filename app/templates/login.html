{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block content %}
<h1>Вход</h1>

{% if error %}<p class="error">{{ error }}</p>{% endif %}
{% if message %}<p class="success">{{ message }}</p>{% endif %}

<form method="post" action="{{ APP_PREFIX }}/login">
    <label>Email
        <input type="email" name="email" required autocomplete="username">
    </label>
    <label>Пароль
        <input type="password" name="password" required minlength="6" autocomplete="current-password">
    </label>
    <button type="submit">Войти</button>
</form>

<p>
    <a href="{{ APP_PREFIX }}/forgot-password">Забыли пароль?</a>
</p>
<p>Нет аккаунта? <a href="{{ APP_PREFIX }}/register">Зарегистрироваться</a></p>

<hr>
<p>Или войдите через:</p>
<a href="{{ APP_PREFIX }}/auth/google/login" class="btn google-btn">🔵 Войти через Google</a>

{% endblock %}

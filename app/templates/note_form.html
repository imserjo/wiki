{% extends "base.html" %}
{% block title %}{{ "Редактирование" if note else "Новая заметка" }}{% endblock %}
{% block content %}
<h1>{{ "Редактирование" if note else "Новая заметка" }}</h1>

{% if error %}<p class="error">{{ error }}</p>{% endif %}

<form method="post"
      action="{{ '/notes/' ~ note.id ~ '/edit' if note else '/notes/new' }}">
    <label>Заголовок
        <input type="text" name="title" required maxlength="255"
               value="{{ note.title if note else '' }}">
    </label>
    <label>Содержимое
        <textarea name="content" rows="12">{{ note.content if note else '' }}</textarea>
    </label>
    <label>Теги (через запятую)
        <input type="text" name="tags"
               value="{{ (note.tags | map(attribute='name') | join(', ')) if note else '' }}">
    </label>
    <div class="form-actions">
        <button type="submit">Сохранить</button>
        <a href="{{ '/notes/' ~ note.id if note else '/notes' }}" class="btn secondary">Отмена</a>
    </div>
</form>

{% if note %}
<form method="post" action="/notes/{{ note.id }}/delete" class="delete-form"
      onsubmit="return confirm('Удалить заметку?');">
    <button type="submit" class="danger">Удалить</button>
</form>
{% endif %}
{% endblock %}

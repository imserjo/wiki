{% extends "base.html" %}
{% block title %}Новый пароль{% endblock %}
{% block content %}
<h1>Новый пароль</h1>

{% if error %}<p class="error">{{ error }}</p>{% endif %}

{% if token %}
<form method="post" action="{{ APP_PREFIX }}/reset-password/{{ token }}">
    <label>Новый пароль
        <input type="password" name="password" required minlength="6"
               autocomplete="new-password">
    </label>
    <label>Повторите пароль
        <input type="password" name="password_confirm" required minlength="6"
               autocomplete="new-password">
    </label>
    <button type="submit">Сохранить новый пароль</button>
</form>
{% else %}
<p><a href="{{ APP_PREFIX }}/forgot-password">Запросить новую ссылку</a></p>
{% endif %}

<p><a href="{{ APP_PREFIX }}/login">← Вернуться ко входу</a></p>
{% endblock %}

{% extends "base.html" %}
{% block title %}Восстановление пароля{% endblock %}
{% block content %}
<h1>Восстановление пароля</h1>

{% if error %}<p class="error">{{ error }}</p>{% endif %}
{% if message %}<p class="success">{{ message }}</p>{% endif %}

{% if not message %}
<form method="post" action="{{ APP_PREFIX }}/forgot-password">
    <label>Email, указанный при регистрации
        <input type="email" name="email" required autocomplete="email">
    </label>
    <button type="submit">Отправить ссылку для сброса</button>
</form>
{% endif %}

<p><a href="{{ APP_PREFIX }}/login">← Вернуться ко входу</a></p>
{% endblock %}

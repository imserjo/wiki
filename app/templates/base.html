<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}База знаний{% endblock %}</title>
    <link rel="stylesheet" href="{{ APP_PREFIX }}/static/style.css">
    <link rel="stylesheet" href="{{ APP_PREFIX }}/static/highlight.css">
    <link rel="icon" type="image/x-icon" href="{{ APP_PREFIX }}/static/favicon.ico">
</head>
<body>
<header>
    <a href="{{ APP_PREFIX }}/notes" class="brand">📚 База знаний</a>
    <nav>
        {% if user %}
            <span class="user">👤 {{ user.username }}</span>
            <a href="{{ APP_PREFIX }}/notes/new">+ Новая</a>
            <a href="{{ APP_PREFIX }}/web/logout">Выйти</a>
        {% else %}
            <a href="{{ APP_PREFIX }}/login">Войти</a>
            <a href="{{ APP_PREFIX }}/register">Регистрация</a>
        {% endif %}
    </nav>
</header>

<main>
    {% block content %}{% endblock %}
</main>

<footer>
    <small>FastAPI + pandas + PostgreSQL</small>
</footer>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}База знаний{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
    <a href="/notes" class="brand">📚 База знаний</a>
    <nav>
        {% if user %}
            <span class="user">👤 {{ user.username }}</span>
            <a href="/notes/new">+ Новая</a>
            <a href="/web/logout">Выйти</a>
        {% else %}
            <a href="/login">Войти</a>
            <a href="/register">Регистрация</a>
        {% endif %}
    </nav>
</header>

<main>
    {% block content %}{% endblock %}
</main>

<footer>
    <small>FastAPI + pandas + PostgreSQL</small>
</footer>
</body>
</html>
